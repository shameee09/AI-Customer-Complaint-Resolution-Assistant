<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Customer Support</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<div class="chat-container">


    <!-- ==================================================
         HEADER
    =================================================== -->

    <div class="chat-header">

        <div class="bot-avatar">
            🤖
        </div>

        <div>

            <h1>
                Customer Assistant Support
            </h1>

            <div class="status">

                <span class="status-dot"></span>

                <span id="status-text">
                    Online
                </span>

            </div>

        </div>

    </div>


    <!-- ==================================================
         CHAT BOX
    =================================================== -->

    <div id="chat-box"
         class="chat-box">


        <!-- Initial Assistant Message -->

        <div class="message bot-message">

            <div class="avatar">
                🤖
            </div>

            <div class="message-content">

                <div class="message-name">
                    Assistant
                </div>

                <div class="bubble">

                    Hi! 👋 I'm your customer support assistant.
                    How can I help you today?

                </div>

            </div>

        </div>

    </div>


    <!-- ==================================================
         TYPING INDICATOR
    =================================================== -->

    <div id="typing"
         class="typing">

        <span></span>
        <span></span>
        <span></span>

        <label>
            Assistant is typing...
        </label>

    </div>


    <!-- ==================================================
         INPUT AREA
    =================================================== -->

    <div class="input-area">


        <textarea
            id="message-input"
            placeholder="Type your message..."
            rows="1">
        </textarea>


        <button
            id="send-button"
            onclick="sendMessage()">

            ➤

        </button>


    </div>


    <!-- ==================================================
         END CHAT
    =================================================== -->

    <div class="end-chat-area">

        <button
            id="end-chat-button"
            type="button"
            onclick="endChat()">

            End Chat

        </button>

    </div>


</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>


</body>

</html>
